[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sthira"
version = "2.0.0.dev0"
description = "Sthira: Citizen emergency guidance over authorized government disaster data"
readme = "prd.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "SQLAlchemy>=2.0.40,<2.1",
    "alembic>=1.15,<2",
    "geoalchemy2>=0.17,<0.21",
    "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
