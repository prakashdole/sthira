<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUNARVAS-AI | പുനർവാസ്-എഐ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Advisory Warning Banner (RUL-001) -->
  <div class="banner-advisory" role="alert">
    <div>
      <span data-i18n="advisory_banner">ADVISORY DECISION SUPPORT ONLY — All outputs require DDMA review and authorized human approval.</span>
      <div class="ml-note" data-i18n="advisory_banner_ml">ഉപദേശക സ്വഭാവമുള്ളത് മാത്രം. ഔദ്യോഗിക ഗസറ്റ് വിജ്ഞാപനമോ ഉത്തരവോ അല്ല.</div>
    </div>
    <div class="audit-indicator" id="audit-status-badge">
      ✓ Verifying Cryptographic Audit...
    </div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <h1 data-i18n="brand_title">PUNARVAS-AI (പുനർവാസ്-എഐ)</h1>
        <p data-i18n="brand_subtitle">Proactive Permanent Relocation Decision Support — Wayanad Pilot</p>
      </div>
      <div class="lang-toggle">
        <button class="btn" onclick="switchLanguage('en')">English</button>
        <button class="btn" onclick="switchLanguage('ml')">മലയാളം</button>
        <button class="btn" onclick="switchLanguage('hi')">हिन्दी</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="overview" onclick="showTab('overview')" data-i18n="tab_overview">Programme Overview</button>
      <button class="tab-btn" data-tab="sites" onclick="showTab('sites')" data-i18n="tab_sites">Candidate Sites & Gates</button>
      <button class="tab-btn" data-tab="parcels" onclick="showTab('parcels')" data-i18n="tab_parcels">Affected Parcels & Truth</button>
      <button class="tab-btn" data-tab="allocation" onclick="showTab('allocation')" data-i18n="tab_allocation">Advisory Allocation</button>
      <button class="tab-btn" data-tab="phase2" onclick="showTab('phase2')" data-i18n="tab_phase2">Phase 2 Shadow Pilot</button>
      <button class="tab-btn" data-tab="phase3" onclick="showTab('phase3')" data-i18n="tab_phase3">Phase 3 Live Ops</button>
      <button class="tab-btn" data-tab="scaling" onclick="showTab('scaling')" data-i18n="tab_scaling">Kerala Scaling (PH-4)</button>
      <button class="tab-btn" data-tab="adaptation" onclick="showTab('adaptation')" data-i18n="tab_adaptation">Multi-State Adaptation (PH-5)</button>
      <button class="tab-btn" data-tab="clearinghouse" onclick="showTab('clearinghouse')" data-i18n="tab_clearinghouse">National Clearinghouse (Phase 6)</button>
      <button class="tab-btn" data-tab="phase9" onclick="showTab('phase9')" data-i18n="tab_phase9">Approvals & Objections (Phase 9)</button>
      <button class="tab-btn" data-tab="phase10" onclick="showTab('phase10')" data-i18n="tab_phase10">Delivery & Completion (Phase 10)</button>
      <button class="tab-btn" data-tab="phase11" onclick="showTab('phase11')" data-i18n="tab_phase11">Dossiers & Manifests (Phase 11)</button>
      <button class="tab-btn" data-tab="phase12" onclick="showTab('phase12')" data-i18n="tab_phase12">Formulas & Compliance (Phase 12)</button>
      <button class="tab-btn" data-tab="phase13" onclick="showTab('phase13')" data-i18n="tab_phase13">Source Readiness & Health (Phase 13)</button>
      <button class="tab-btn" data-tab="audit" onclick="showTab('audit')" data-i18n="tab_audit">Audit & Integrity</button>
    </nav>

    <main id="tab-content">
      <!-- Dynamic Content Rendered by app.js -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
